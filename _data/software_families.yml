- id: simplex
  title: SimpleX
  label: Shared simulation infrastructure
  description: SimpleX is a C++ library for fluid and solid mechanics. It includes Eulerian and particle-based fluid solvers and finite element models of deformable solids.
  features: I took over maintenance and development of SimpleX at Dartmouth and continued that work at Georgia Tech.
  examples: Free-surface Clebsch · SPH Bubble · MELP
  url: /proj/simplex/
  code: https://gitlab.com/boolzhu/simplex
- id: meso
  title: MESO
  label: GPU numerical computing
  description: MESO implements grid and particle methods for fluid simulation on GPUs. Its C++/CUDA grid solver uses discrete exterior calculus to compute velocity divergence and pressure gradients.
  features: I led the team that started MESO in 2022. We used it in our work on interface tracking. Other groups have used it for fluidic design and thin-shell optimisation.
  examples: Triangle Edge Cuts · NeuralFluid · Thin-shell Optimisation
  url: /proj/meso/
  code: https://github.com/wang-mengdi/meso
- id: cirrus
  title: Cirrus
  label: GPU multigrid solvers
  description: Cirrus is a fluid simulator for resolving fine vortices on locally refined grids.
  features: I began building Cirrus on MESO in 2024.
  examples: Cirrus · Cirrus-AMG
  url: /projects/#cirrus
